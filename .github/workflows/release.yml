name: Build and Release

# v로 시작하는 태그(예: v0.1.0)를 push 하면 자동 실행됩니다.
on:
  push:
    tags:
      - "v*"

# Release 를 만들려면 쓰기 권한이 필요합니다.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # 1. 소스 코드 가져오기 (변경 내역 생성을 위해 전체 히스토리 필요)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Dockerfile 로 빌드 환경 만들기
      - name: Build builder image
        run: docker build -t patch-builder .

      # 3. 컨테이너 안에서 빌드 (태그 이름이 버전으로 들어감)
      - name: Build in container
        run: |
          docker run --rm \
            -e APP_VERSION="${GITHUB_REF_NAME}" \
            -v "${GITHUB_WORKSPACE}:/src" \
            patch-builder

      # 4. 빌드 결과 검증: 실행했을 때 버전이 태그와 같은지 확인
      - name: Verify binary
        run: |
          OUTPUT="$(./build/patch_pipeline)"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "${GITHUB_REF_NAME}"

      # 5. 이전 태그 이후의 커밋 목록으로 변경 내역 만들기
      - name: Generate release notes
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -z "$PREV_TAG" ]; then
            RANGE="${GITHUB_REF_NAME}"
          else
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
          fi
          {
            echo "## Changes"
            git log --pretty=format:"- %s (%h)" "$RANGE"
          } > notes.md
          cat notes.md

      # 6. 버전이 붙은 바이너리 이름으로 복사 후 Release 생성
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/patch_pipeline "patch_pipeline-${GITHUB_REF_NAME}-linux-x86_64"
          gh release create "${GITHUB_REF_NAME}" \
            "patch_pipeline-${GITHUB_REF_NAME}-linux-x86_64" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md
